<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>正在播放 · 聆境</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* ============ 沉浸播放页 · 动态取色流体背景 ============ */
  html,body{height:100%}
  body[data-page="player"]{
    background:#0B0F0E;color:var(--dk-ink);overflow:hidden;
  }
  body[data-page="player"]::before{ /* 动态取色：封面主色流体光斑 */
    content:"";position:fixed;inset:-20%;z-index:0;pointer-events:none;filter:blur(90px);
    background:
      radial-gradient(46% 42% at 22% 24%, rgba(91,138,114,.52), transparent 66%),
      radial-gradient(40% 38% at 78% 30%, rgba(52,84,102,.4), transparent 62%),
      radial-gradient(44% 40% at 62% 88%, rgba(232,168,124,.16), transparent 64%),
      radial-gradient(30% 30% at 12% 82%, rgba(143,188,143,.18), transparent 60%);
    animation:drift 22s ease-in-out infinite alternate;
  }
  @keyframes drift{
    0%{transform:translate3d(0,0,0) scale(1) rotate(0deg)}
    50%{transform:translate3d(2%,-2%,0) scale(1.08) rotate(2deg)}
    100%{transform:translate3d(-2%,2%,0) scale(1.04) rotate(-2deg)}
  }
  body[data-page="player"]::after{opacity:.05} /* 噪点加强质感 */
  body[data-page="player"]:not(.playing)::before{animation-play-state:paused}

  .pv{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;
      max-width:1240px;margin:0 auto;padding:22px clamp(18px,4vw,48px) calc(20px + env(safe-area-inset-bottom));
      animation:pv-in .6s var(--ease) both}
  @keyframes pv-in{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}

  /* 顶栏 */
  .pv-top{display:flex;align-items:center;gap:8px;flex:none}
  .pv-top .sp{flex:1;text-align:center}
  .pv-now-label{font-size:11px;letter-spacing:.32em;color:var(--dk-sub);text-transform:uppercase;font-family:var(--f-display)}
  .pv-ghost-btn{
    width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:19px;
    color:var(--dk-sub);transition:all .2s var(--ease);
  }
  .pv-ghost-btn:hover{background:rgba(255,255,255,.09);color:#fff}
  .pv-ghost-btn:active{transform:scale(.94)}

  /* 主区：左封面 / 右信息+歌词 */
  .pv-main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);gap:clamp(28px,5vw,72px);align-items:center;padding:18px 0 8px}
  .pv-stage{display:flex;flex-direction:column;align-items:center;gap:26px}
  .pv-cover{
    width:100%;max-width:420px;aspect-ratio:1;border-radius:var(--r-xl);overflow:hidden;
    box-shadow:0 30px 90px rgba(0,0,0,.55),0 12px 48px rgba(91,138,114,.28);
    transform:perspective(1200px) rotateY(-4deg) rotateX(1deg);
    transition:transform .5s var(--ease),box-shadow .5s var(--ease);
  }
  .pv-cover:hover{transform:perspective(1200px) rotateY(0) rotateX(0) scale(1.01)}
  .pv-cover img{width:100%;height:100%;object-fit:cover}
  body:not(.playing) .pv-cover img{filter:brightness(.82) saturate(.92)}
  body.playing .pv-cover{animation:cover-float 7s ease-in-out infinite}
  @keyframes cover-float{0%,100%{transform:perspective(1200px) rotateY(-4deg) rotateX(1deg) translateY(0)}50%{transform:perspective(1200px) rotateY(-2deg) rotateX(0) translateY(-8px)}}

  /* 曲目信息 */
  .pv-meta{text-align:center;max-width:420px}
  .pv-title{font-family:var(--f-display);font-size:30px;font-weight:600;letter-spacing:.01em;line-height:1.3}
  .pv-artist{margin-top:6px;color:var(--dk-sub);font-size:15px}
  .pv-tags{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:14px}
  .pv-chip{
    font-size:12px;padding:4.5px 12px;border-radius:999px;
    background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.85);
    backdrop-filter:blur(8px);
  }
  .pv-chip.q{color:#BFE3CF;border-color:rgba(143,188,143,.45)}
  .pv-like{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:18px;
    color:rgba(255,255,255,.65);transition:all .25s var(--ease)}
  .pv-like:hover{background:rgba(255,255,255,.1);color:#fff}
  .pv-like.on{color:var(--accent);animation:like-pop .35s var(--ease)}
  @keyframes like-pop{40%{transform:scale(1.3)}100%{transform:scale(1)}}

  /* 歌词（逐句卡拉OK） */
  .pv-lyrics{position:relative;height:100%;max-height:460px;overflow:hidden;
    mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent);
    -webkit-mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent)}
  .lyr-scroll{transition:transform .55s var(--ease);will-change:transform}
  .lyr-line{padding:11px 4px;cursor:pointer;border-radius:var(--r-md);transition:opacity .3s}
  .lyr-cn{font-size:23px;font-weight:600;line-height:1.45;color:rgba(255,255,255,.38);
    transition:all .35s var(--ease);font-family:var(--f-display);letter-spacing:.01em}
  .lyr-en{font-size:13px;color:rgba(255,255,255,.22);margin-top:3px;transition:color .35s}
  .lyr-line:hover .lyr-cn{color:rgba(255,255,255,.62)}
  .lyr-line.on{transform:translateX(6px)}
  .lyr-line.on .lyr-cn{
    background:linear-gradient(92deg,#FFFFFF 30%,#CDE7D8 75%,#F4D9BC);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    font-size:27px;text-shadow:0 0 42px rgba(143,188,143,.22);
  }
  .lyr-line.on .lyr-en{color:rgba(255,255,255,.45)}

  /* 频谱带 */
  .pv-spectrum{display:flex;align-items:flex-end;justify-content:center;gap:5px;height:26px;opacity:.5;margin:6px 0 2px}
  .pv-spectrum b{width:3.5px;border-radius:2px;background:linear-gradient(180deg,#8FBC8F,rgba(143,188,143,.25));
    animation:sp 1.1s ease-in-out infinite;height:30%}
  body:not(.playing) .pv-spectrum b{animation-play-state:paused;height:12%!important}
  @keyframes sp{0%,100%{height:22%}50%{height:96%}}
  .pv-spectrum b:nth-child(2n){animation-duration:.9s;animation-delay:.12s}
  .pv-spectrum b:nth-child(3n){animation-duration:1.35s;animation-delay:.28s}
  .pv-spectrum b:nth-child(5n){animation-duration:.8s;animation-delay:.4s}

  /* 进度与控制 */
  .pv-bottom{flex:none;display:flex;flex-direction:column;gap:6px;padding-top:6px}
  .pv-progress{display:flex;align-items:center;gap:14px}
  .pv-time{font-size:12px;color:var(--dk-sub);font-variant-numeric:tabular-nums;min-width:38px}
  .pv-time.right{text-align:right}
  .pv-bar{position:relative;flex:1;height:18px;display:flex;align-items:center;cursor:pointer}
  .pv-bar .rail{width:100%;height:4px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
  .pv-bar .fill{position:absolute;left:0;top:50%;transform:translateY(-50%);height:4px;border-radius:3px;
    background:linear-gradient(90deg,#8FBC8F,#E8C9A0);width:0%;transition:width .25s linear}
  .pv-bar .knob{position:absolute;top:50%;width:11px;height:11px;border-radius:50%;background:#fff;
    transform:translate(-50%,-50%) scale(0);transition:transform .2s var(--ease);box-shadow:0 2px 10px rgba(0,0,0,.4)}
  .pv-bar:hover .knob,.pv-bar:active .knob{transform:translate(-50%,-50%) scale(1)}

  .pv-ctrl{display:flex;align-items:center;justify-content:center;gap:clamp(14px,3vw,30px);padding:6px 0 2px}
  .pv-ctrl .btn-icon{color:var(--dk-sub)}
  .pv-ctrl .btn-icon:hover{background:rgba(255,255,255,.1);color:#fff}
  .pv-ctrl .btn-icon.toggle.on{color:#BFE3CF}
  .pv-play{
    width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:25px;color:#0B0F0E;
    background:linear-gradient(135deg,#FFFFFF,#DCE8DF);
    box-shadow:0 10px 34px rgba(143,188,143,.35),0 4px 14px rgba(0,0,0,.4);
    transition:all .25s var(--ease);
  }
  .pv-play:hover{transform:scale(1.06);box-shadow:0 14px 44px rgba(143,188,143,.5),0 6px 18px rgba(0,0,0,.4)}
  .pv-play:active{transform:scale(.97)}
  .pv-play i{margin-left:2px}
  .pv-play .i-pause{display:none;margin-left:0}
  body.playing .pv-play .i-play{display:none}
  body.playing .pv-play .i-pause{display:block}

  .pv-side{position:absolute;right:clamp(18px,4vw,48px);bottom:calc(96px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
  .pv-foot{text-align:center;font-size:11px;color:rgba(255,255,255,.25);letter-spacing:.08em}

  /* 队列抽屉 */
  .queue-mask{position:fixed;inset:0;z-index:70;background:rgba(6,9,8,.45);backdrop-filter:blur(3px);
    opacity:0;pointer-events:none;transition:opacity .3s}
  .queue-mask.open{opacity:1;pointer-events:auto}
  .queue{
    position:fixed;top:0;right:0;bottom:0;z-index:71;width:min(340px,88vw);
    background:rgba(23,28,26,.92);backdrop-filter:blur(28px) saturate(1.4);
    border-left:1px solid rgba(255,255,255,.08);
    transform:translateX(102%);transition:transform .4s var(--ease);
    display:flex;flex-direction:column;padding:22px 0 0;
  }
  .queue.open{transform:none}
  .queue-head{display:flex;align-items:center;justify-content:space-between;padding:0 20px 14px}
  .queue-head b{font-size:15px;font-weight:650}
  .queue-head span{font-size:12px;color:var(--dk-sub);margin-left:8px}
  .queue-list{overflow:auto;flex:1;padding:0 10px 20px;scrollbar-width:none}
  .queue-list::-webkit-scrollbar{display:none}
  .q-row{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:var(--r-md);cursor:pointer;transition:background .2s}
  .q-row:hover{background:rgba(255,255,255,.06)}
  .q-row img{width:40px;height:40px;border-radius:var(--r-sm);object-fit:cover;flex:none}
  .q-row .qm{flex:1;min-width:0}
  .q-row .qt{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .q-row .qa{font-size:12px;color:var(--dk-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .q-row.cur .qt{color:#BFE3CF}
  .q-row .q-eq{display:none;align-items:flex-end;gap:2px;height:14px;padding-right:6px}
  .q-row.cur .q-eq{display:flex}
  .q-eq b{width:2.5px;background:#8FBC8F;border-radius:1px;animation:eq 1s ease-in-out infinite}
  .q-eq b:nth-child(1){height:6px}.q-eq b:nth-child(2){height:12px;animation-delay:.15s}.q-eq b:nth-child(3){height:9px;animation-delay:.3s}

  /* H5 适配 */
  @media (max-width:900px){
    .pv{padding:14px 18px calc(16px + env(safe-area-inset-bottom))}
    .pv-main{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);gap:16px;align-items:start;padding-top:8px}
    .pv-stage{flex-direction:row;align-items:center;gap:18px;width:100%}
    .pv-cover{width:148px;max-width:none;flex:none;transform:none;animation:none!important}
    .pv-meta{text-align:left;flex:1;min-width:0}
    .pv-title{font-size:22px}
    .pv-tags{justify-content:flex-start}
    .pv-lyrics{max-height:none;height:100%}
    .lyr-cn{font-size:19px}.lyr-line.on .lyr-cn{font-size:22px}
    .lyr-en{display:none}
    .pv-side{display:none}
    .pv-ctrl{gap:18px}
    .pv-play{width:56px;height:56px;font-size:22px}
  }
</style>
</head>
<body data-page="player">
<div class="pv">
  <!-- 顶栏 -->
  <header class="pv-top">
    <button class="pv-ghost-btn" id="btnCollapse" aria-label="收起播放页"><i data-icon="chevron-down"></i></button>
    <div class="sp"><span class="pv-now-label">Now Playing · 聆境</span></div>
    <button class="pv-ghost-btn" id="btnTimer" aria-label="睡眠定时器"><i data-icon="timer"></i></button>
    <button class="pv-ghost-btn" id="btnMore" aria-label="更多"><i data-icon="more-horizontal"></i></button>
  </header>

  <!-- 主区 -->
  <section class="pv-main">
    <div class="pv-stage">
      <div class="pv-cover"><img id="pvCover" alt="专辑封面"></div>
      <div class="pv-meta">
        <h1 class="pv-title" id="pvTitle"></h1>
        <div class="pv-artist" id="pvArtist"></div>
        <div class="pv-tags">
          <span class="pv-chip" id="pvSrc"></span>
          <span class="pv-chip q" id="pvQuality"></span>
          <button class="pv-like" id="pvLike" aria-label="喜欢"><i data-icon="heart"></i></button>
        </div>
      </div>
    </div>

    <div class="pv-lyrics" id="lyrBox">
      <div class="lyr-scroll" id="lyrScroll"></div>
    </div>
  </section>

  <!-- 底部：频谱 / 进度 / 控制 -->
  <footer class="pv-bottom">
    <div class="pv-spectrum" id="spectrum"></div>
    <div class="pv-progress">
      <span class="pv-time" id="tCur">0:00</span>
      <div class="pv-bar" id="bar" aria-label="播放进度">
        <div class="rail"></div><div class="fill" id="fill"></div><div class="knob" id="knob"></div>
      </div>
      <span class="pv-time right" id="tAll">0:00</span>
    </div>
    <div class="pv-ctrl">
      <button class="btn-icon toggle" id="btnShuffle" aria-label="随机播放"><i data-icon="shuffle"></i></button>
      <button class="btn-icon" id="btnPrev" aria-label="上一首"><i data-icon="skip-back"></i></button>
      <button class="pv-play" id="btnPlay" aria-label="播放/暂停">
        <i class="i-play" data-icon="play"></i><i class="i-pause" data-icon="pause"></i>
      </button>
      <button class="btn-icon" id="btnNext" aria-label="下一首"><i data-icon="skip-forward"></i></button>
      <button class="btn-icon toggle on" id="btnRepeat" aria-label="单曲循环"><i data-icon="repeat"></i></button>
    </div>
    <div class="pv-foot">演示播放页 · 曲目与歌词为虚构内容 · 音源徽标演示聚合能力</div>
  </footer>

  <!-- 右下快捷 -->
  <div class="pv-side">
    <button class="pv-ghost-btn" id="btnQueue" aria-label="播放队列"><i data-icon="list-music"></i></button>
  </div>
</div>

<!-- 队列抽屉 -->
<div class="queue-mask" id="queueMask"></div>
<aside class="queue" id="queueDrawer">
  <div class="queue-head">
    <div><b>播放队列</b><span id="queueCount"></span></div>
    <button class="pv-ghost-btn" id="btnQueueClose" aria-label="关闭"><i data-icon="x"></i></button>
  </div>
  <div class="queue-list" id="queueList"></div>
</aside>

<script src="mock.js"></script>
<script src="app.js"></script>
<script>
(function(){
  const song = App.songById(DB.now.songId);
  const DUR = 252; // 4:12
  const $ = (s) => document.querySelector(s);

  /* ---------- 基础信息渲染 ---------- */
  $('#pvCover').src = App.cover(song.cover);
  $('#pvTitle').textContent = song.title;
  $('#pvArtist').textContent = `${song.artist} · 专辑《${song.album}》`;
  $('#pvSrc').textContent = '网易云 · 已聚合 3 源';
  $('#pvQuality').textContent = DB.now.quality;
  if (App.isLiked(song.id)) $('#pvLike').classList.add('on');
  const fmt = (s) => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
  $('#tAll').textContent = fmt(DUR);

  /* ---------- 歌词渲染 ---------- */
  const scroll = $('#lyrScroll'), box = $('#lyrBox');
  scroll.innerHTML = DB.lyrics.map((l, i) =>
    `<div class="lyr-line" data-i="${i}"><div class="lyr-cn">${l.cn}</div><div class="lyr-en">${l.en}</div></div>`
  ).join('');
  const lines = [...scroll.children];

  /* ---------- 频谱 ---------- */
  $('#spectrum').innerHTML = '<b></b>'.repeat(22);

  /* ---------- 队列 ---------- */
  const queueSongs = DB.now.queue.map(App.songById);
  $('#queueCount').textContent = `${queueSongs.length} 首`;
  $('#queueList').innerHTML = queueSongs.map((s) =>
    `<div class="q-row ${s.id === song.id ? 'cur' : ''}" data-sid="${s.id}">
       <img src="${App.cover(s.cover)}" alt="${s.album}">
       <div class="qm"><div class="qt">${s.title}</div><div class="qa">${s.artist}</div></div>
       <span class="q-eq"><b></b><b></b><b></b></span>
     </div>`
  ).join('');
  $('#queueList').addEventListener('click', (e) => {
    const row = e.target.closest('.q-row');
    if (row) App.toast(`已切到「${App.songById(row.dataset.sid).title}」（演示）`);
  });
  const openQueue = (v) => {
    $('#queueDrawer').classList.toggle('open', v);
    $('#queueMask').classList.toggle('open', v);
  };
  $('#btnQueue').addEventListener('click', () => openQueue(true));
  $('#btnQueueClose').addEventListener('click', () => openQueue(false));
  $('#queueMask').addEventListener('click', () => openQueue(false));

  /* ---------- 播放模拟（进度 + 歌词联动） ---------- */
  let t = 8.5, playing = true, curIdx = -1;
  const body = document.body;
  body.classList.toggle('playing', playing);

  function syncLyrics(){
    let idx = 0;
    for (let i = 0; i < DB.lyrics.length; i++) if (t >= DB.lyrics[i].t) idx = i;
    if (idx !== curIdx){
      curIdx = idx;
      lines.forEach((el, i) => el.classList.toggle('on', i === idx));
      const boxH = box.clientHeight, lineH = lines[idx].offsetHeight;
      const target = lines[idx].offsetTop - boxH / 2 + lineH / 2;
      scroll.style.transform = `translateY(${-Math.max(0, target)}px)`;
    }
  }
  function syncProgress(){
    const p = Math.min(100, (t / DUR) * 100);
    $('#fill').style.width = p + '%';
    $('#knob').style.left = p + '%';
    $('#tCur').textContent = fmt(Math.min(t, DUR));
  }
  setInterval(() => {
    if (!playing) return;
    t += 0.25;
    if (t >= DUR) t = 0; // 单曲循环
    syncLyrics(); syncProgress();
  }, 250);
  syncLyrics(); syncProgress();

  /* ---------- 控制 ---------- */
  const setPlay = (v) => { playing = v; body.classList.toggle('playing', v); };
  $('#btnPlay').addEventListener('click', () => setPlay(!playing));
  const jump = (dt) => {
    let idx = Math.min(DB.lyrics.length - 1, Math.max(0, curIdx + dt));
    t = DB.lyrics[idx].t; syncLyrics(); syncProgress();
  };
  $('#btnPrev').addEventListener('click', () => jump(-1));
  $('#btnNext').addEventListener('click', () => jump(1));
  lines.forEach((el) => el.addEventListener('click', () => {
    t = DB.lyrics[+el.dataset.i].t; syncLyrics(); syncProgress();
    App.toast('已跳转到该句（演示）');
  }));
  $('#btnShuffle').addEventListener('click', (e) => {
    const b = e.currentTarget; b.classList.toggle('on');
    App.toast(b.classList.contains('on') ? '随机播放已开启' : '随机播放已关闭');
  });
  $('#btnRepeat').addEventListener('click', (e) => {
    const b = e.currentTarget; b.classList.toggle('on');
    App.toast(b.classList.contains('on') ? '单曲循环' : '列表循环');
  });
  $('#pvLike').addEventListener('click', () => {
    const add = App.toggleLike(song.id);
    $('#pvLike').classList.toggle('on', add);
    App.toast(add ? '已加入「我喜欢的音乐」' : '已取消喜欢');
  });
  $('#btnCollapse').addEventListener('click', () => location.href = 'index.html');
  $('#btnTimer').addEventListener('click', () => App.toast('睡眠定时器：45 分钟后停止播放（演示）'));
  $('#btnMore').addEventListener('click', () => App.toast('音质切换 / 均衡器 / 分享（演示）'));

  /* 进度条点击拖动 */
  const bar = $('#bar');
  const seek = (e) => {
    const r = bar.getBoundingClientRect();
    t = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * DUR;
    syncLyrics(); syncProgress();
  };
  bar.addEventListener('pointerdown', (e) => {
    seek(e);
    const mv = (ev) => seek(ev);
    const up = () => { window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); };
    window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up);
  });

  App.mountIcons(document.body);
})();
</script>
</body>
</html>
